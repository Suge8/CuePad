name: CI audit snapshot
on:
  push:
    branches: [ci/cuepad-native-audit-20261117]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 280f77cdede29b6561ac0e0884b5e660323764d5
          fetch-depth: 0
      - run: git archive --format=tar.gz --output=cuepad-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: cuepad-source
          path: cuepad-source.tar.gz
          retention-days: 1
