name: Swift

# 合并进主干后的兜底：与本机同一个入口 apple/scripts/xc.sh，各段各占一台干净的 runner 冷编译，真 Agent 用例跑全量。
# PR 不在这里跑：合并前的门是本机的 xc.sh signoff（signoff.sh 头注释）。发布只认这里全绿的提交（release-context.py 的 verified）。
# runner 标签 xcode-27：actions/runner-images 的 macOS 27 镜像（Xcode 27.0 与 iOS 27.0 模拟器 iPhone 17 都在）。
# CloudKit 真同步、推送、后台与签名只能在设备上验，这里只跑替身。
on:
  # 发版标签（mac/…、ios/…）指向的提交进主干时已经跑过，打标签不再跑
  push:
    branches: [main]
  # 分支上要云端这一遍（如只在 runner 上出现的红）就手动触发
  workflow_dispatch:

# 主干不取消在跑的（接连合并时每次都被下一次取消，就一直没有跑完的结果），排着的只留最新一个；手动触发的同一分支新的顶掉旧的
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  actions: read

jobs:
  xc:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: check, args: check }
          - { name: test kit, args: test kit }
          - { name: test mac, args: test mac }
          # 一次约 20 分钟里模拟器开机约 7 分钟、编译约 12 分钟，13 条用例只跑几秒；模拟器在高负载的 runner 上还会开不起来，红的多半不是代码
          - { name: test ios sync, args: test ios -only-testing:CuePadTests/SyncAccountTests -only-testing:CuePadTests/FileSyncTests -only-testing:CuePadTests/NewSessionFlowTests }
    env:
      # xcodebuild 只把 TEST_RUNNER_ 开头的变量交给测试进程：测试自己起的 node 脚本（MCP 替身等）要找得到 /opt/homebrew/bin 里的 node。
      # 真 Agent 不走这个 PATH：它们装在专用缓存里、旁边带着 node（PinnedAgent）
      TEST_RUNNER_PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
      # 钉住的 Agent 缺一家就红，不跳过（PinnedAgent.fullMatrix）
      TEST_RUNNER_CUEPAD_AGENT_MATRIX: full
      # 真 Agent 用例跑全量（RealAgents.swift）；本机的签核只跑每家的冒烟
      TEST_RUNNER_CUEPAD_AGENT_TESTS: all
    steps:
      # lint 要 origin/main 与发布标签：整段历史、全部标签
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # 镜像默认 27.1；本项目按 27.0（27A266a）开发。选中靠 xcode-select 而不是 DEVELOPER_DIR：测试里起的 cc、python3 走系统的选择，不认环境变量
      - run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version; xcrun --show-sdk-path; xcrun simctl list runtimes; env | grep -iE 'sdkroot|developer_dir' || true
      # 上一遍全绿之后没动 apple/ 与本文件的（文档、设计稿、落地页）只跑 lint，同本机签核的口径（signoff.sh）。
      # 比的是上一遍全绿的提交而不是上一次推送：排着的一遍会被后来的合并顶掉，被顶掉的那次改动要算进来
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(gh run list --workflow swift.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha' || true)"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" && git diff --quiet "$base" HEAD -- apple .github/workflows/swift.yml; then
            echo "light=1" >> "$GITHUB_OUTPUT"
          fi
      # lint 要 ripgrep；镜像里有就不装（下载失败红过）
      - if: matrix.name == 'check'
        run: command -v rg || brew install ripgrep
      - if: steps.scope.outputs.light == '1' && matrix.name == 'check'
        run: apple/scripts/lint.sh
      # 测试连的真 Agent：版本只在 apple/CuePadKit/Tests/agents.json，装进专用缓存（agents.py）；缓存随清单变
      - if: steps.scope.outputs.light != '1' && (matrix.name == 'test kit' || matrix.name == 'test mac')
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/cuepad-agents
          key: cuepad-agents-${{ hashFiles('apple/CuePadKit/Tests/agents.json', 'apple/scripts/agents.py') }}
      - if: steps.scope.outputs.light != '1' && (matrix.name == 'test kit' || matrix.name == 'test mac')
        run: apple/scripts/xc.sh agents install
      - if: steps.scope.outputs.light != '1'
        run: apple/scripts/xc.sh ${{ matrix.args }}
        timeout-minutes: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ strategy.job-index }}
          path: apple/.derived/test.log
          if-no-files-found: ignore
