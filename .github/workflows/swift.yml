name: Swift
on:
  push:
    branches: [ci/cuepad-native-audit-20261117]
  workflow_dispatch:
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
permissions:
  contents: read
  actions: read
jobs:
  xc:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: check, cache: check-mac, check: mac, args: "" }
          - { name: test kit, cache: test-kit, check: kit, args: test kit }
          - { name: test mac, cache: test-mac, check: "", args: test mac }
          - { name: test ios sync, cache: test-ios, check: ios, args: test ios -only-testing:CuePadTests/SyncAccountTests -only-testing:CuePadTests/FileSyncTests -only-testing:CuePadTests/NewSessionFlowTests }
    env:
      CUEPAD_CACHE_REMARKS: YES
      TEST_RUNNER_PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
      TEST_RUNNER_CUEPAD_AGENT_MATRIX: full
      TEST_RUNNER_CUEPAD_AGENT_TESTS: all
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(gh run list --workflow swift.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha' || true)"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" && git diff --quiet "$base" HEAD -- apple .github/workflows/swift.yml; then
            echo "light=1" >> "$GITHUB_OUTPUT"
          fi
      - if: matrix.name == 'check'
        run: command -v rg || brew install ripgrep
      - if: steps.scope.outputs.light == '1' && matrix.name == 'check'
        run: apple/scripts/lint.sh
      - id: xcode
        if: steps.scope.outputs.light != '1'
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/{print $3}')" >> "$GITHUB_OUTPUT"
          echo "os=$(sw_vers -buildVersion)" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.light != '1'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/cuepad-xc/CompilationCache.noindex
          key: cuepad-xc-v1-${{ runner.arch }}-${{ steps.xcode.outputs.os }}-${{ steps.xcode.outputs.build }}-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: |
            cuepad-xc-v1-${{ runner.arch }}-${{ steps.xcode.outputs.os }}-${{ steps.xcode.outputs.build }}-${{ matrix.cache }}-
      - if: steps.scope.outputs.light != '1' && (matrix.name == 'test kit' || matrix.name == 'test mac')
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/cuepad-agents
          key: cuepad-agents-${{ hashFiles('apple/CuePadKit/Tests/agents.json', 'apple/scripts/agents.py') }}
      - if: steps.scope.outputs.light != '1' && (matrix.name == 'test kit' || matrix.name == 'test mac')
        run: apple/scripts/xc.sh agents install
      - if: steps.scope.outputs.light != '1' && matrix.name == 'check'
        run: apple/scripts/xc.sh check sources
      - if: steps.scope.outputs.light != '1' && matrix.check != ''
        run: apple/scripts/xc.sh check ${{ matrix.check }}
        timeout-minutes: 30
      - if: steps.scope.outputs.light != '1' && matrix.args != ''
        run: apple/scripts/xc.sh ${{ matrix.args }}
        timeout-minutes: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ strategy.job-index }}
          path: apple/.derived/test.log
          if-no-files-found: ignore
