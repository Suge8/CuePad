<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>CuePad — Say it once. Cue keeps your agents moving.</title>
		<meta
			name="description"
			content="A calm notebook that runs your coding agents. Jot it down; Cue hands it to Claude Code, Codex, Pi or OpenCode, keeps them moving, and only asks you what really needs you. Native on Mac, iPhone and iPad. Local-first, free and open source."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:title" content="CuePad — Say it once. Cue keeps your agents moving." />
		<meta
			property="og:description"
			content="A calm notebook that runs your coding agents: Cue starts the sessions, keeps them moving, and only asks you what really needs you."
		/>
		<meta property="og:url" content="https://cue-pad.com/" />
		<meta property="og:image" content="https://cue-pad.com/assets/og.jpg" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" type="image/png" href="/assets/favicon.png" />
		<link rel="apple-touch-icon" href="/assets/favicon.png" />
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/assets/fonts/bricolage-latin.woff2"
			crossorigin
		/>
		<script>
			// Set language before first paint to avoid a flash of the wrong locale.
			(function () {
				var lang = 'en';
				try {
					lang = localStorage.getItem('cuepad-lang') || '';
				} catch (e) {}
				if (!lang) {
					lang = (navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
				}
				var root = document.documentElement;
				root.lang = lang === 'zh' ? 'zh-CN' : 'en';
				root.setAttribute('data-lang', lang);
				root.classList.add('js');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
